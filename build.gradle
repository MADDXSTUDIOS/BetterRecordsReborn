import org.jetbrains.kotlin.gradle.dsl.JvmTarget

/////////////////////////////
// BuildScript and Plugins //
/////////////////////////////

plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin {
    compilerOptions.jvmTarget = JvmTarget.JVM_21
}

version = "${minecraft_version}-${mod_version}"
base.archivesName = archivesbasename

//////////////////
// Dependencies //
//////////////////

repositories {
    mavenCentral()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Must come after the neoForge block, which creates the additionalRuntimeClasspath configuration
dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"

    // MP3 decoding. Plain library (not a mod), so it is bundled into the jar with Jar-in-Jar
    // and added to the dev runtime classpath separately.
    implementation("com.googlecode.soundlibs:jlayer:${jlayer_version}") { transitive = false }
    jarJar("com.googlecode.soundlibs:jlayer") {
        transitive = false
        version {
            strictly "[${jlayer_version},)"
            prefer jlayer_version
        }
    }
    additionalRuntimeClasspath("com.googlecode.soundlibs:jlayer:${jlayer_version}") { transitive = false }
}

///////////////
// Artifacts //
///////////////

def replacedProperties = [
        version        : version,
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_license    : mod_license,
        author         : author,
        loader_range   : loader_range,
        neo_range      : neo_range,
        minecraft_range: minecraft_range,
]

processResources {
    inputs.properties(replacedProperties)

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(replacedProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
