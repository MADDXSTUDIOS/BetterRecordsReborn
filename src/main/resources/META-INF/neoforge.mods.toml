modLoader="kotlinforforge"
loaderVersion="${loader_range}"
issueTrackerURL="https://github.com/AngrySoundTech/BetterRecords/issues"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    authors="${author}"
    credits=""
    description='''
    BetterRecords
    '''
    displayURL="https://github.com/AngrySoundTech/BetterRecords"

[[mixins]]
    config="mixins.betterrecords.json"

[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"
